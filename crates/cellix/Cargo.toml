[package]
name = "cellix"
description = "The AI companion IDE inside your agent: a Claude Code mod, Codex plugin and Gemini CLI extension"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/quill-27f/cellix"
readme = "../../README.md"
keywords = ["ai", "ide", "editor", "terminal", "claude"]
categories = ["command-line-utilities", "text-editors"]

# `cargo binstall cellix` takes the release's binary instead of building it.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/cellix-{ target }.tar.gz"
bin-dir = "cellix{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides]
x86_64-unknown-linux-gnu = { pkg-url = "{ repo }/releases/download/v{ version }/cellix-x86_64-unknown-linux-musl.tar.gz" }
aarch64-unknown-linux-gnu = { pkg-url = "{ repo }/releases/download/v{ version }/cellix-aarch64-unknown-linux-musl.tar.gz" }

[dependencies]
png = "0.18.1"
cellix-agent = { path = "../cellix-agent", version = "0.3.1" }
cellix-core = { path = "../cellix-core", version = "0.3.1" }
cellix-doc = { path = "../cellix-doc", version = "0.3.1" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
cellix-input = { path = "../cellix-input", version = "0.3.1" }
cellix-lang = { path = "../cellix-lang", version = "0.3.1" }
cellix-render = { path = "../cellix-render", version = "0.3.1" }
cellix-review = { path = "../cellix-review", version = "0.3.1" }
cellix-term = { path = "../cellix-term", version = "0.3.1" }
base64 = "0.22"
flate2 = "1"
crossterm = "0.29"
unicode-width = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rmpv = "1.3.1"
alacritty_terminal = "0.26"
portable-pty = "0.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[dev-dependencies]
cellix-doc = { path = "../cellix-doc", features = ["fixtures"] }
tempfile = "3"
vt100 = "0.16"

[lints]
workspace = true
