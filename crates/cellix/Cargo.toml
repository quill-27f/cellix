[package]
name = "cellix"
description = "A terminal-native editor for reviewing and correcting agent work"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
libc = "0.2.191"
png = "0.18.1"
cellix-agent = { path = "../cellix-agent", version = "0.1.0" }
cellix-core = { path = "../cellix-core", version = "0.1.0" }
cellix-doc = { path = "../cellix-doc", version = "0.1.0" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
cellix-input = { path = "../cellix-input", version = "0.1.0" }
cellix-lang = { path = "../cellix-lang", version = "0.1.0" }
cellix-render = { path = "../cellix-render", version = "0.1.0" }
cellix-review = { path = "../cellix-review", version = "0.1.0" }
cellix-term = { path = "../cellix-term", version = "0.1.0" }
base64 = "0.22"
crossterm = "0.29"
unicode-width = "0.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
rmpv = "1.3.1"
alacritty_terminal = "0.26"
portable-pty = "0.9"

[dev-dependencies]
flate2 = "1"
cellix-doc = { path = "../cellix-doc", features = ["fixtures"] }
tempfile = "3"
vt100 = "0.16"

[lints]
workspace = true
