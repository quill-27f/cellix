[package]
name = "cellix-doc"
description = "Documents for Cellix: typeset math, HTML export, LaTeX structure and PDF pages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
base64 = "0.22"
flate2 = "1"
layout-rs = "0.1"
mermaid-rs-renderer = { version = "0.3", default-features = false }
resvg = "0.47"
serde = "1"
serde_json = { version = "1", features = ["preserve_order"] }
harper-core = "3"
hayro = "0.8"
latex-rust = { version = "3.0.1", features = ["png"] }
png = "0.18.1"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }

[features]
fixtures = []

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
