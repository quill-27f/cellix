[package]
name = "cellix-agent"
description = "Local socket and CLI adapters for Cellix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cellix-review = { version = "0.2.2", path = "../cellix-review" }
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
