[package]
name = "cellix-agent"
description = "Local socket and CLI adapters for Cellix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cellix-review = { version = "0.4.2", path = "../cellix-review" }
# Canonical paths without Windows' `\\?\`, which git and Claude Code don't take. On Unix it's
# std's own.
dunce = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# Tokens come from /dev/urandom on Unix.
[target.'cfg(not(unix))'.dependencies]
getrandom = "0.3"

# Whether a socket note's Cellix is still running.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
