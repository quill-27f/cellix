name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: The version has its changelog entry
        run: python3 -I harness/notes.py "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" > /dev/null
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace 2>&1 | tee test.log
        shell: bash -o pipefail {0}
      - name: Every feature marked passing passed
        shell: bash
        run: |
          for t in $(jq -r '.[] | select(.passes) | .test' harness/features.json); do
            grep -Eq "^test ([a-z_0-9]+::)*$t \.\.\. (ok|ignored)" test.log || { echo "did not pass: $t"; exit 1; }
          done

  tex:
    # Build PDF and Export to PDF where TeX Live is the only TeX: latexmk, then plain pdflatex
    # with BibTeX passes. Tectonic isn't installed here, and the tests hide it besides.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install TeX Live, without tectonic
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-recommended texlive-bibtex-extra latexmk
      - run: cargo test -p cellix --test tex -- --ignored --test-threads=1

  macos:
    # macOS minutes cost ten times as much on a private repo, so main only.
    if: github.event_name == 'push'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      # Files as they are in the repository, as a crate from crates.io has them.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --no-fail-fast
      # An experiment: whether a click reaches Cellix through Microsoft's own ConPTY, as
      # Windows Terminal ships it, rather than the system's. portable-pty loads a conpty.dll
      # beside the test, which starts the OpenConsole.exe beside it.
      - name: PTY tests through Microsoft's own ConPTY (experiment)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          $package = "$env:RUNNER_TEMP\conpty"
          Invoke-WebRequest https://www.nuget.org/api/v2/package/Microsoft.Windows.Console.ConPTY -OutFile "$package.zip"
          Expand-Archive "$package.zip" $package
          Get-ChildItem -Recurse $package -Include conpty.dll,OpenConsole.exe | ForEach-Object FullName
          $dll = Get-ChildItem -Recurse $package -Filter conpty.dll | Where-Object FullName -Match 'x64' | Select-Object -First 1
          $console = Get-ChildItem -Recurse $package -Filter OpenConsole.exe | Where-Object FullName -Match 'x64' | Select-Object -First 1
          Copy-Item $dll.FullName, $console.FullName target\debug\deps\
          cargo test -p cellix --test pty -- --include-ignored --test-threads=2
