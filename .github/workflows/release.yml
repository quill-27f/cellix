name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  linux:
    # A static binary runs on any GPU box, whatever its libc and with no Rust on it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p cellix --target x86_64-unknown-linux-musl
      - name: It runs, and links nothing
        run: |
          binary=target/x86_64-unknown-linux-musl/release/cellix
          "$binary" --version
          ! ldd "$binary" 2>&1 | grep -q '=>'
      - uses: actions/upload-artifact@v4
        with:
          name: cellix-x86_64-linux
          path: target/x86_64-unknown-linux-musl/release/cellix
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp target/x86_64-unknown-linux-musl/release/cellix cellix-x86_64-linux
          gh release create "$GITHUB_REF_NAME" cellix-x86_64-linux --generate-notes
