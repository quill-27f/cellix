name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { target: x86_64-apple-darwin, os: macos-latest, runs: false }
          # Static, so it runs on any server, whatever its libc and with no Rust on it.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, runs: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, runs: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p cellix --target ${{ matrix.target }}
      - name: It runs
        if: matrix.runs
        run: target/${{ matrix.target }}/release/cellix --version
      - name: It links nothing
        if: runner.os == 'Linux'
        run: "! ldd target/${{ matrix.target }}/release/cellix 2>&1 | grep -q '=>'"
      - name: Pack it
        run: |
          mkdir pack
          cp target/${{ matrix.target }}/release/cellix README.md LICENSE-MIT LICENSE-APACHE pack/
          tar -czf cellix-${{ matrix.target }}.tar.gz -C pack .
      - uses: actions/upload-artifact@v4
        with:
          name: cellix-${{ matrix.target }}
          path: cellix-${{ matrix.target }}.tar.gz

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: archives
          merge-multiple: true
      - name: Make the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd archives && shasum -a 256 *.tar.gz > checksums.txt)
          python3 -I harness/formula.py "${GITHUB_REF_NAME#v}" archives cellix.rb
          gh release create "$GITHUB_REF_NAME" archives/* cellix.rb --generate-notes
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN, so cellix.rb is left on the release to copy across."
            exit 0
          fi
          git clone "https://x-access-token:$TAP_TOKEN@github.com/quill-27f/homebrew-tap" tap
          mkdir -p tap/Formula
          cp cellix.rb tap/Formula/cellix.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/cellix.rb
          git commit -m "cellix $GITHUB_REF_NAME"
          git push
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN, so crates.io is left for 'cargo publish --workspace'."
            exit 0
          fi
          cargo publish --workspace --locked
