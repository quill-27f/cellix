name: release
on:
  # Releasing is bumping the version (harness/x bump) and pushing to main: once CI passes on a
  # commit whose version has no release yet, this builds it, tags it and publishes it.
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  # A tag pushed by hand releases too.
  push:
    tags: ["v*"]
  # Run by hand, it builds every target. On main it also releases a version that has no release
  # yet, and with `finish` it does the tap and crates.io steps a released version is missing.
  workflow_dispatch:
    inputs:
      finish:
        description: Update the tap and crates.io for a version already released, if they lack it
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  plan:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      sha: ${{ steps.plan.outputs.sha }}
      release: ${{ steps.plan.outputs.release }}
      finish: ${{ steps.plan.outputs.finish }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          FINISH: ${{ inputs.finish }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          sha=$(git rev-parse HEAD)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME doesn't match the version in Cargo.toml, $version"
            exit 1
          fi
          release=false
          finish=false
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "v$version is already released."
            [ "$FINISH" = true ] && finish=true
          elif ! git merge-base --is-ancestor "$sha" origin/main; then
            # Only what CI passed on main is released; a branch run by hand just builds.
            echo "$sha isn't on main, so this only builds."
          else
            # A tag left from an earlier try must be on this commit, or the release would carry
            # one commit's archives under another's tag.
            tagged=$(git ls-remote origin "refs/tags/v$version^{}" | cut -f1)
            [ -n "$tagged" ] || tagged=$(git ls-remote origin "refs/tags/v$version" | cut -f1)
            if [ -n "$tagged" ] && [ "$tagged" != "$sha" ]; then
              echo "::error::v$version is tagged on $tagged, not $sha. Delete the tag or bump the version."
              exit 1
            fi
            python3 -I harness/notes.py "$version" > /dev/null
            echo "v$version has no release yet, so this releases it."
            release=true
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "finish=$finish" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    # Run by hand, it builds even when there's nothing to release, to prove the builds work.
    if: needs.plan.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest, runs: true }
          - { target: x86_64-apple-darwin, os: macos-latest, runs: false }
          # Static, so it runs on any server, whatever its libc and with no Rust on it.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, runs: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, runs: true }
          # Windows is paused while no one tests there (2026-11-09); put this line back to ship it.
          # - { target: x86_64-pc-windows-msvc, os: windows-latest, runs: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p cellix --target ${{ matrix.target }}
        env:
          # The C runtime goes in the binary, so Windows needs no Visual C++ redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
      - name: It runs
        if: matrix.runs
        shell: bash
        run: target/${{ matrix.target }}/release/cellix --version
      - name: It links nothing
        if: runner.os == 'Linux'
        run: "! ldd target/${{ matrix.target }}/release/cellix 2>&1 | grep -q '=>'"
      - name: Pack it
        if: runner.os != 'Windows'
        run: |
          mkdir pack
          cp target/${{ matrix.target }}/release/cellix README.md LICENSE-MIT LICENSE-APACHE pack/
          tar -czf cellix-${{ matrix.target }}.tar.gz -C pack .
      - name: Pack it
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory pack | Out-Null
          Copy-Item target/${{ matrix.target }}/release/cellix.exe, README.md, LICENSE-MIT, LICENSE-APACHE pack/
          Compress-Archive -Path pack/* -DestinationPath cellix-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cellix-${{ matrix.target }}
          path: cellix-${{ matrix.target }}.*
          if-no-files-found: error

  publish:
    needs: [plan, build]
    # A run by hand with nothing to release or finish stops at the builds.
    if: >-
      always() && needs.plan.result == 'success' && (
        (needs.plan.outputs.release == 'true' && needs.build.result == 'success') ||
        needs.plan.outputs.finish == 'true')
    runs-on: ubuntu-latest
    # A tag pushed by hand and the CI run on the same commit can both get here.
    concurrency: release-${{ needs.plan.outputs.version }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Finishing publishes what was released, not what main has now.
          ref: ${{ needs.plan.outputs.release == 'true' && needs.plan.outputs.sha || format('v{0}', needs.plan.outputs.version) }}
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.release == 'true'
        with:
          path: archives
          merge-multiple: true
      - name: Make the release
        id: release
        if: needs.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            echo "v$VERSION was released while this ran."
            echo "made=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A kind with no archive, as Windows while it's paused, is left out, not an error.
          (cd archives && shopt -s nullglob && shasum -a 256 *.tar.gz *.zip > checksums.txt)
          python3 -I harness/formula.py "$VERSION" archives cellix.rb
          python3 -I harness/notes.py "$VERSION" > notes.md
          # Makes the tag too, on the commit CI passed.
          gh release create "v$VERSION" archives/* cellix.rb --target "${{ needs.plan.outputs.sha }}" \
            --title "Cellix $VERSION" --notes-file notes.md
          echo "made=true" >> "$GITHUB_OUTPUT"
      # Each step below does only what's missing, so a run with `finish` can redo a failed one.
      - name: Update the Homebrew tap
        if: steps.release.outputs.made == 'true' || needs.plan.outputs.finish == 'true'
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "No HOMEBREW_TAP_TOKEN, so cellix.rb is left on the release to copy across."
            exit 0
          fi
          [ -f cellix.rb ] || gh release download "v$VERSION" --pattern cellix.rb
          git clone "https://x-access-token:$TAP_TOKEN@github.com/quill-27f/homebrew-tap" tap
          mkdir -p tap/Formula
          cp cellix.rb tap/Formula/cellix.rb
          cd tap
          git add Formula/cellix.rb
          if git diff --cached --quiet; then
            echo "The tap already has $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "cellix $VERSION"
          git push
      - uses: dtolnay/rust-toolchain@stable
        if: steps.release.outputs.made == 'true' || needs.plan.outputs.finish == 'true'
      - name: Publish to crates.io
        if: steps.release.outputs.made == 'true' || needs.plan.outputs.finish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "No CARGO_REGISTRY_TOKEN, so crates.io is left for 'cargo publish --workspace'."
            exit 0
          fi
          # Only the crates crates.io lacks at this version, so a publish cut short can resume.
          missing=()
          for manifest in crates/*/Cargo.toml; do
            name=$(sed -n 's/^name = "\(.*\)"$/\1/p' "$manifest" | head -1)
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "cellix release (https://github.com/quill-27f/cellix)" \
              "https://crates.io/api/v1/crates/$name/$VERSION")
            [ "$code" = 200 ] && echo "$name $VERSION is on crates.io." || missing+=(-p "$name")
          done
          if [ ${#missing[@]} = 0 ]; then
            echo "Every crate is on crates.io at $VERSION."
            exit 0
          fi
          cargo publish --locked "${missing[@]}"
